<style>
/* layout: one dojo floor (canvas) centred in the window; menus float over it; controls strip below */
:root{
  color-scheme: dark;
  --ai:#101a2e;      /* 藍の夜: page + arena ground */
  --ai-2:#1a2843;    /* raised surfaces */
  --line:#2f4166;    /* hairlines */
  --washi:#ebe6d8;   /* text, parryable shots */
  --mute:#8f9ab0;    /* secondary text */
  --kin:#e6b85c;     /* 金: the player's blade, reflected shots, cleared */
  --shu:#e4573f;     /* 朱: danger, cannot be parried */
  --ao:#4a9be8;      /* 蒼: cannot be parried or dashed through */
  --murasaki:#b07fe0;/* 紫: shots that seal on hit */
  --veil:rgba(16,26,46,.9);
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
/* a game page: no text selection, long-press menus, tap highlights or double-tap zoom while playing */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,#stage,#touch{touch-action:manipulation}
#pad,.tb,#cv{touch-action:none}
body{
  margin:0;background:var(--ai);color:var(--washi);
  font:15px/1.65 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;
  display:flex;flex-direction:column;gap:10px;
}
.top,.keys,#touch,#stage{width:100%;max-width:980px;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.1em;margin:0}
.tag{color:var(--mute);font-size:.8rem}
.tools{display:flex;gap:8px}
.tools button,.seg button,.ghost{
  font:inherit;font-size:.82rem;color:var(--washi);background:var(--ai-2);
  border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;
}
.tools button:hover,.seg button:hover,.ghost:hover{border-color:var(--mute)}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}

#stage{position:relative;flex:1 1 auto;min-height:320px;display:grid;place-items:center}
#cv{display:block;border:1px solid var(--line);border-radius:3px;touch-action:none;background:var(--ai)}
#ov{position:absolute;inset:0;display:grid;place-items:center;background:var(--veil);overflow:auto;padding:16px}
.panel{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
.panel.wide{max-width:760px}
.eyebrow{margin:0;font-size:.74rem;letter-spacing:.32em;color:var(--kin)}
.logo{position:relative;display:inline-block;align-self:flex-start;margin:0;
  font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,4.8rem);line-height:1.05;letter-spacing:.06em}
.logo::after{content:"";position:absolute;left:-6%;right:-10%;top:55%;height:2px;background:var(--kin);transform:rotate(-9deg);transform-origin:left center}
.logo small{font-size:.42em;letter-spacing:.2em;color:var(--kin);margin-left:.3em}
h2.head{margin:0;font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:.06em;line-height:1.2}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.88rem;max-width:66ch}
.rules li{padding-left:1.1em;text-indent:-1.1em}
.rules li::before{content:"―";color:var(--line);margin-right:.25em}
.k-w{color:var(--washi)} .k-r{color:var(--shu)} .k-g{color:var(--kin)} .k-b{color:var(--ao)} .k-m{color:var(--murasaki)}
.ver{position:absolute;right:14px;bottom:10px;margin:0;font:500 .75rem var(--mono);color:var(--mute)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{border-color:var(--kin);color:var(--kin)}
.seg small{color:var(--mute);margin-left:4px}
.dnote{margin:0;color:var(--mute);font-size:.82rem}
.primary{font:inherit;font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.18em;
  background:var(--kin);color:var(--ai);border:0;border-radius:3px;padding:8px 24px;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.primary[disabled]{opacity:.4;cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:var(--washi);background:var(--ai-2);
  border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer}
.mode:hover{border-color:var(--kin)}
.mode b{font-family:var(--display);font-size:1.3rem;letter-spacing:.1em}
.mode span{color:var(--mute);font-size:.82rem}
.hint{color:var(--mute);font-size:.8rem}
.best{margin:0;color:var(--mute);font-size:.82rem;font-variant-numeric:tabular-nums}
.best b{font-family:var(--mono);font-weight:500;color:var(--washi)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}

.cell{font:500 .82rem var(--mono);font-variant-numeric:tabular-nums;color:var(--washi);background:var(--ai-2);
  border:1px solid var(--line);border-radius:3px;padding:7px 0;cursor:pointer;position:relative}
.cell:hover{border-color:var(--mute)}
.cell.clr{border-color:var(--kin);color:var(--kin)}
.cell.kes{background:var(--kin);color:var(--ai);border-color:var(--kin)}
.cell small{display:block;font-size:.62rem;line-height:1.25;color:var(--mute)}
.cell.kes small,.cell.uta small{color:inherit;opacity:.8}
.cell.easy{border-style:dashed;border-color:var(--kin);color:var(--kin)}
.cell.uta{background:var(--washi);color:var(--ai);border-color:var(--kin);box-shadow:inset 0 0 0 2px var(--kin)}
.cell[disabled]{opacity:.28;cursor:not-allowed}
.cell.cur{outline:2px solid var(--washi);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mute);font-size:.78rem}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid var(--kin);vertical-align:-1px;margin-right:4px}
.legend i.f{background:var(--kin)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--washi);background:var(--ai-2)}
.chip.r{border-color:var(--shu);color:var(--shu)}
.chip.g{border-color:var(--kin);color:var(--kin)}
.chip.q{color:var(--mute);border-style:dashed}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--kin);width:16px;height:16px}
.res-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.rank{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;color:var(--kin)}
.rank.lost{color:var(--mute);font-size:1.6rem}
dl.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:0;font-size:.92rem}
dl.stats dt{color:var(--mute)}
dl.stats dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.newrec{margin:0;color:var(--kin);font-weight:700}
.score{margin:0;font-family:var(--mono);font-size:2.2rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.note{margin:0;color:var(--mute);font-size:.85rem}
textarea.code{width:100%;font:500 .72rem/1.4 var(--mono);color:var(--washi);background:var(--ai-2);border:1px solid var(--line);border-radius:3px;padding:8px;resize:vertical;word-break:break-all;-webkit-user-select:text;user-select:text}
textarea.code:focus-visible{outline:2px solid var(--kin);outline-offset:1px}

.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;color:var(--mute);font-size:.8rem}
kbd{font-family:var(--mono);font-size:.74rem;color:var(--washi);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--ai-2)}

#touch{display:flex;justify-content:space-between;align-items:center;gap:16px;touch-action:none;user-select:none;-webkit-user-select:none;padding-bottom:4px}
#pad{width:132px;height:132px;border-radius:50%;border:1px solid var(--line);background:var(--ai-2);position:relative;flex:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--line);pointer-events:none}
.tbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.tb{width:84px;height:84px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:1.25rem;border:1px solid var(--line);touch-action:none}
#bParry{background:var(--kin);color:var(--ai);border-color:var(--kin);width:96px;height:96px}
#bDash{background:var(--ai-2);color:var(--washi)}
@media (pointer:coarse){ .keys{display:none} }
</style>

<header class="top">
  <div class="brand"><h1>返し刃</h1><span class="tag">三十の鬼と、弾いて斬る果し合い（試作）</span></div>
  <div class="tools">

    <button id="muteBtn" type="button">音 入</button>

  <div id="pad" aria-label="移動パッド"><div id="knob"></div></div>

<span>弾き・斬り <kbd>Z</kbd> <kbd>左クリック</kbd></span>

  <span>一時停止 <kbd>P</kbd> <kbd>Esc</kbd> ・やり直し <kbd>R</kbd> ・音 <kbd>M</kbd></span>
</footer>

function rollShape(type, r) {
  const R = (a, b) => a + r() * (b - a), I = (a, b) => Math.floor(R(a, b + 1));
  const dir = () => (r() < .5 ? 1 : -1);

// properties too heavy to put on every shot of a dense volley
const HEAVY = new Set(['bigorb', 'redbig', 'mines', 'orbit', 'split', 'redsplit', 'wallsplit', 'dropper', 'fake', 'cluster', 'snake']);
const GENS = [];
for (const e of SHAPE_TYPES) for (const m of ['plain', ...ATK_IDS.filter(isProp)]) {
  const E = EMIT[e];
  if (HEAVY.has(m) && E.cnt === 'hi') continue;
  if (E.stream && (m === 'orbit' || m === 'mines' || m === 'gravity' || m === 'swirl')) continue;
  if ((e === 'rain' || e === 'lanes' || e === 'curtain') && (m === 'gravity' || m === 'homing' || m === 'swirl' || m === 'boomerang')) continue;
  if (e === 'vortex' && (m === 'homing' || m === 'stopgo' || m === 'boomerang' || m === 'accel')) continue;
  // a firework's shell has to fly straight to its burst
  if (e === 'firework' && ['needle', 'orbit', 'stopgo', 'swirl', 'split', 'redsplit', 'mines', 'curve', 'decel', 'gravity', 'boomerang'].includes(m)) continue;
  // turning round the point it was fired from only keeps the shape of a layout that spreads from one point all round
  if (m === 'swirl' && !['ring', 'spiral', 'flower', 'gapring', 'star', 'cross', 'pinwheel', 'helix'].includes(e)) continue;
  if ((e === 'rows' || e === 'box' || e === 'curtain' || e === 'lanes' || e === 'arc') && (m === 'split' || m === 'redsplit' || m === 'cluster' || m === 'snake' || m === 'wallsplit')) continue;
  // a solid line of blue shots is a wall nobody can pass
  if ((e === 'rows' || e === 'box') && m === 'blue') continue;
  GENS.push({ id: e + '.' + m, e, m, intro: Math.max(E.intro, m === 'plain' ? 1 : introAt[m]), name: m === 'plain' ? E.n : E.n + 'の' + GIM[m].n });
}
const GEN = Object.fromEntries(GENS.map(g => [g.id, g]));

// =====================================================================
// difficulty: one scale for stages and free play alike. Free play's levels sit at stages 10, 30, 60 and 100.
// =====================================================================
function diffAt(lv) {
  const s = clamp((lv - 1) / 149, 0, 1);
  // past the first few, every enemy is a wall to be learned: getting to its second form on a first try is doing well,
  // and each skill takes try after try. h climbs from stage 6 to 25 and holds
  const h = clamp((lv - 5) / 20, 0, 1);
  return {
    s,
    // gentle at first, then climbing hard from the middle on: the middle takes days to learn, the last stretch months.
    // Same end points at stage 150 as before; the middle now rises earlier.
    // the enemies come to finish the player fast: quicker shots and less rest, but thinner volleys,
    // so it is reflexes and reading that are tested rather than squeezing through a wall of shots
    spd: (.84 + .3 * s + .57 * Math.pow(s, 1.3)) * 1.26 * (1 + .12 * h),    // shot speed
    gap: (1.22 - .75 * s - .15 * s * s) * .74 * (1 - .3 * h),              // rest between attacks
    den: (.9 + .7 * s + 1.4 * Math.pow(s, 1.3)) * .8 * (1 + .15 * h),        // shots per volley
    warn: (1.12 - .5 * s - .1 * s * s) * .95 * (1 - .1 * h),                // warning time of beams, strikes and charges
    red: lv < 3 ? 0 : Math.min(.8, .22 + .58 * s),
    layer: lv < 12 ? 0 : Math.min(.85, .05 + .8 * Math.pow((lv - 12) / 138, .7)),   // chance that a second volley overlaps the first
    hpK: .85 + .5 * s,
  };
}

    if (z.t >= z.warn && (!z.hit || z.linger) && z.t <= z.warn + z.act) {
      if (!z.hit) {
        z.hit = true; burst(z.x, z.y, C.shu, z.heavy ? 22 : 10, z.heavy ? 300 : 220, .35); addShake(z.heavy ? 7 : 3); sfx('zap');
      }
      if (Math.hypot(P.x - z.x, P.y - z.y) < z.r + P.r - 4) hurt(z.dmg || (z.heavy ? 44 : 20));
    }
    if (z.t > z.warn + z.act) zones.splice(i, 1);
  }

  // turrets
  for (let i = turrets.length - 1; i >= 0; i--) {
    const t = turrets[i]; t.life -= dt; t.next -= dt; t.a += dt * 2;
    if (t.next <= 0 && t.life > .3) { t.next = t.rate; shootFrom(t.x, t.y, aimFrom(t.x, t.y), 200 * SPD(), t.kind); }
    if (t.life <= 0) turrets.splice(i, 1);
  }

  // bullets
  const frozen = fx.freeze > 0;
  for (let i = bullets.length - 1; i >= 0; i--) {
    // a hit can change form, which swaps in a shorter bullet list mid-loop
    const b = bullets[i];
    if (!b) continue;
    b.age += dt;
    if (b.own === 'p' && !stats.won) {
      // returned shots go for the nearest launcher while any stand
      const tg = launchers.length ? nearestLauncher(b.x, b.y) : B;
      const want = Math.atan2(tg.y - b.y, tg.x - b.x), cur = Math.atan2(b.vy, b.vx), s = Math.hypot(b.vx, b.vy);
      let da = want - cur; da = Math.atan2(Math.sin(da), Math.cos(da));
      const na = cur + clamp(da, -5 * dt, 5 * dt);

    }
    if (b.own === 'b') {
      if (frozen) { checkHitPlayer(b, i); continue; }
      if (b.orb) {
        const o = b.orb, c = o.c || B; o.t -= dt; o.ang += o.w * dt; o.r = Math.min(70, o.r + 120 * dt);
        b.x = c.x + Math.cos(o.ang) * o.r; b.y = c.y + Math.sin(o.ang) * o.r;
        // let go along the line it was first sent on, so an aimed volley still goes for the player
        if (o.t <= 0) { const ra = o.a0 !== undefined ? o.a0 : o.ang; b.vx = Math.cos(ra) * o.out; b.vy = Math.sin(ra) * o.out; b.orb = null; }
        else { checkHitPlayer(b, i); continue; }
      }
      if (b.home > 0) {
        b.home -= dt;
        const want = Math.atan2(P.y - b.y, P.x - b.x), cur = Math.atan2(b.vy, b.vx), s = Math.hypot(b.vx, b.vy);
        let da = want - cur; da = Math.atan2(Math.sin(da), Math.cos(da));
        const na = cur + clamp(da, -b.turn * dt, b.turn * dt);
        b.vx = Math.cos(na) * s; b.vy = Math.sin(na) * s;
      }
      if (b.stop) {
        const st = b.stop; st.t -= dt;
        if (st.phase === 0) { const k = Math.max(0, 1 - dt * 5); b.vx *= k; b.vy *= k; if (st.t <= 0) { st.phase = 1; st.t = st.wait; } }
        else if (st.t <= 0) { const a = st.ang !== undefined ? st.ang : aimFrom(b.x, b.y); b.vx = Math.cos(a) * st.spd; b.vy = Math.sin(a) * st.spd; b.stop = null; }
      }
      if (b.acc) { const s = Math.hypot(b.vx, b.vy) || 1, ns = Math.min(b.acc.max, s + b.acc.a * dt); b.vx *= ns / s; b.vy *= ns / s; }
      if (b.grav) b.vy += b.grav * dt;

          const a = b.boom.aim ? aimFrom(b.x, b.y) : Math.atan2(b.vy, b.vx) + Math.PI;
          b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
        }
      }
      if (b.wv) { const w = b.wv; w.t += dt; const lat = Math.cos(w.t * w.fr + w.ph) * w.amp * w.fr * .5; b.vx = Math.cos(w.a) * w.s - Math.sin(w.a) * lat; b.vy = Math.sin(w.a) * w.s + Math.cos(w.a) * lat; }
      if (b.brake) { const k = Math.max(0, 1 - dt * 3.2); b.vx *= k; b.vy *= k; }
      if (stepShot(b, dt)) { bullets.splice(i, 1); continue; }
      if (b.mine) {
        b.mine -= dt;
        if (b.mine <= 0 || (b.age > .8 && Math.hypot(P.x - b.x, P.y - b.y) < 60)) { burstRing(b.x, b.y, 8, 170 * SPD()); sfx('zap'); bullets.splice(i, 1); continue; }
      }
      if (b.sp3) { b.sp3 -= dt; if (b.sp3 <= 0) { const a = Math.atan2(b.vy, b.vx), s = Math.hypot(b.vx, b.vy) * 1.25; for (const da of [-.38, 0, .38]) shootFrom(b.x, b.y, a + da, s, b.child || b.kind); bullets.splice(i, 1); continue; } }
      if (b.big) { b.split -= dt; if (b.split <= 0 || b.x < 20 || b.x > W - 20 || b.y < 40 || b.y > H - 20) { burstRing(b.x, b.y, NN(14), 170 * SPD(), () => (kc++ % 2 ? 'r' : 'w')); burst(b.x, b.y, C.washi, 12, 200, .4); sfx('zap'); bullets.splice(i, 1); continue; } }
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.bounce > 0) {
      if (b.x < 6 || b.x > W - 6) { b.vx = -b.vx; b.x = clamp(b.x, 6, W - 6); b.bounce--; }
      else if (b.y < 36 || b.y > H - 6) { b.vy = -b.vy; b.y = clamp(b.y, 36, H - 6); b.bounce--; }
    }
    // 壁割れ弾: on reaching a wall, three pieces come back off it
    if (b.wsplit && b.own === 'b' && b.age > .2 && (b.x < 8 || b.x > W - 8 || b.y < 38 || b.y > H - 8)) {
      const nx = b.x < 8 ? 1 : b.x > W - 8 ? -1 : 0, ny = b.y < 38 ? 1 : b.y > H - 8 ? -1 : 0, a = Math.atan2(ny, nx), sp = Math.hypot(b.vx, b.vy) * .8;
      for (const da of [-.6, 0, .6]) shootFrom(clamp(b.x, 10, W - 10), clamp(b.y, 40, H - 10), a + da, sp, b.kind === 'b' ? 'b' : 'r');
      bullets.splice(i, 1); continue;
    }
    if (b.grace > 0) b.grace -= dt;
    if (b.life <= 0 || (b.grace <= 0 && (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30))) { bullets.splice(i, 1); continue; }
    if (b.own === 'b') { checkHitPlayer(b, i); continue; }
    if (stats.won) continue;
    if (hitHand(b)) { bullets.splice(i, 1); continue; }
    if (launchers.length) {
      const l = nearestLauncher(b.x, b.y);
      if (Math.hypot(b.x - l.x, b.y - l.y) < 16 + b.r) { bullets.splice(i, 1); hitLauncher(l, b.dmg); continue; }
    }
    if (Math.hypot(b.x - B.x, b.y - B.y) < B.r + b.r + (B.barrier || B.seal || B.guard ? 20 : 0)) {
      // counter stance: the shot comes straight back as a white shot

        const a = aimFrom(b.x, b.y); b.own = 'b'; b.kind = 'w'; b.vx = Math.cos(a) * 560; b.vy = Math.sin(a) * 560; b.life = 4; b.perfect = false;
        pop(B.x, B.y - B.r - 16, '返', C.washi, 22); sfx('block'); continue;
      }
      if (F.special.includes('shield') && !invulnerable()) {
        let da = Math.atan2(b.y - B.y, b.x - B.x) - B.shieldA; da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) < 1.1) { bullets.splice(i, 1); burst(b.x, b.y, C.washi, 6, 160, .25); sfx('block'); continue; }
      }
      bullets.splice(i, 1);
      if (invulnerable() || (RL.perfectOnly && !b.perfect)) { burst(b.x, b.y, C.washi, 5, 160, .25); sfx('block'); if (RL.perfectOnly && !invulnerable()) pop(B.x, B.y - B.r - 14, '無', C.mute, 18); continue; }
      burst(b.x, b.y, b.perfect ? C.kin : C.washi, b.perfect ? 10 : 5, 180, .3);
      // a 極 return cuts through the enemy's brief invulnerability
      damageBoss(b.dmg, false, false, b.perfect ? { unit: b.unit || b.dmg } : null);
    }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= 30 * dt; if (t.life <= 0) texts.splice(i, 1); }
  for (let i = after.length - 1; i >= 0; i--) { after[i].a -= dt * 2.6; if (after[i].a <= 0) after.splice(i, 1); }
  for (let i = slashes.length - 1; i >= 0; i--) { slashes[i].life -= dt; if (slashes[i].life <= 0) slashes.splice(i, 1); }
  for (let i = streaks.length - 1; i >= 0; i--) { streaks[i].life -= dt; if (streaks[i].life <= 0) streaks.splice(i, 1); }

}
// 明滅弾: harmless while it is dark
const blinkOff = b => b.blink && Math.floor(b.age / b.blink + b.blinkPh) % 2 === 1;
function checkHitPlayer(b, i) {

  if (P.parryT > 0 && parryable(b) && d < P.r + b.r + PARRY_R) { reflect(b, d); return; }
  if (d < P.r + b.r - 2 && hurt(b.dmg || (b.kind === 'w' ? 16 : 20), b.kind === 'b')) {
    if (b.sealHit) applySeal(b.sealHit);
    if (b.curse) { fx.pslow = Math.max(fx.pslow || 0, 3); pop(P.x, P.y - 26, '呪 鈍', C.murasaki, 20); }

}

// =====================================================================
// drawing
// =====================================================================
function diamond(x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
const fmtLen = t => t >= 60 ? `${Math.floor(t / 60)}分${Math.round(t % 60) ? Math.round(t % 60) + '秒' : ''}` : `${Math.round(t)}秒`;
function fmt(t) { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
const glyph = () => RUN && RUN.mode === 'stage' ? RUN.st.glyph : '鬼';

function drawEnemy(x, y, alpha, real) {
  ctx.globalAlpha = alpha;
  const tick = 8 + B.phase * 2;
  ctx.strokeStyle = B.phase >= 3 ? C.shu : C.mute; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const a = B.spin + i * TAU / 12, c = Math.cos(a), s = Math.sin(a);
    ctx.beginPath(); ctx.moveTo(x + c * (B.r + 6), y + s * (B.r + 6)); ctx.lineTo(x + c * (B.r + 6 + tick), y + s * (B.r + 6 + tick)); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(x, y, B.r, 0, TAU);
  ctx.fillStyle = real && B.hurtF > 0 ? C.washi : C.ai2; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = real && (B.mode === 'dash' || B.mode === 'aim') ? C.shu : C.washi; ctx.stroke();
  ctx.fillStyle = real && B.hurtF > 0 ? C.ai : (real && B.stagger > 0 ? C.kin : real && B.stance > 0 ? C.kin : C.washi);
  ctx.font = `800 ${Math.round(B.r * 1.15)}px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(real && B.stagger > 0 ? '崩' : real && B.stance > 0 ? '構' : glyph(), x, y + 1);
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  ctx.fillStyle = C.ai; ctx.fillRect(0, 0, SW, SH);
  ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  ctx.drawImage(bg, 0, 0, W, H);

  // shrunk arena
  if (fx.shrinkK > 0) {
    const b = bounds();
    ctx.fillStyle = 'rgba(8,13,24,0.72)';
    ctx.fillRect(0, 0, W, b.y0 - 10); ctx.fillRect(0, b.y1 + 10, W, H); ctx.fillRect(0, 0, b.x0 - 10, H); ctx.fillRect(b.x1 + 10, 0, W, H);
    ctx.strokeStyle = C.shu; ctx.lineWidth = 2; ctx.strokeRect(b.x0 - 10, b.y0 - 10, b.x1 - b.x0 + 20, b.y1 - b.y0 + 20);
  }
  if (fx.swap > 0) { ctx.strokeStyle = C.shu; ctx.globalAlpha = .5 + .3 * Math.sin(gt * 8); ctx.lineWidth = 6; ctx.strokeRect(3, 3, W - 6, H - 6); ctx.globalAlpha = 1; }

  // floor effects
  for (const s of slows) {
    ctx.globalAlpha = Math.min(.35, s.t * 1.5, s.life); ctx.fillStyle = C.line;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); ctx.globalAlpha = Math.min(.8, s.life);
    ctx.strokeStyle = C.mute; ctx.setLineDash([3, 5]); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
  for (const w of wells) {
    ctx.strokeStyle = C.mute; ctx.lineWidth = 1.5;
    for (let k = 0; k < 4; k++) { const rr = ((gt * 50 + k * 22) % 88) + 6; ctx.globalAlpha = Math.min(1, w.life) * (1 - rr / 100) * (w.t > .6 ? 1 : .4); ctx.beginPath(); ctx.arc(w.x, w.y, rr, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.fillStyle = C.ai2; ctx.beginPath(); ctx.arc(w.x, w.y, 7, 0, TAU); ctx.fill();
  }
  if (stones) {
    for (const p of stones.pts) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, TAU);
      ctx.fillStyle = p.on ? C.kin : C.ai2; ctx.fill(); ctx.strokeStyle = p.on ? C.kin : C.washi; ctx.lineWidth = 2; ctx.stroke();
      if (p.on || stones.show > 0) { ctx.fillStyle = p.on ? C.ai : C.washi; ctx.font = `800 20px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('壱弐参'[p.label - 1], p.x, p.y + 1); }
      else { ctx.fillStyle = C.mute; ctx.font = `800 18px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('？', p.x, p.y + 1); }
    }
  }
  if (tether) {
    ctx.strokeStyle = C.shu; ctx.globalAlpha = .25; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(tether.ax, tether.ay, tether.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = .8; ctx.beginPath(); ctx.moveTo(tether.ax, tether.ay); ctx.lineTo(P.x, P.y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = C.shu; diamond(tether.ax, tether.ay, 6); ctx.fill();
  }

  if (wind) {
    ctx.strokeStyle = C.washi; ctx.lineWidth = 1.2;
    for (const s of streaks) {
      const k = 1 - s.life / .5, x = s.x + wind.ax * k * 120, y = s.y + wind.ay * k * 120;
      ctx.globalAlpha = (wind.warn > 0 ? .12 : .28) * (s.life / .5);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + wind.ax * 34, y + wind.ay * 34); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  for (const z of zones) {

      const k = z.t / z.warn;
      ctx.globalAlpha = .12 + .2 * k; ctx.fillStyle = C.shu;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * k, 0, TAU); ctx.fill();
      ctx.globalAlpha = .8; ctx.strokeStyle = C.shu; ctx.lineWidth = z.follow && z.t < z.follow ? 1 : 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    } else {

      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
      ctx.fillStyle = C.washi; ctx.beginPath(); ctx.arc(z.x, z.y, z.r * .35, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  for (const L of lasers) {

    ctx.lineCap = 'butt';

      ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]);
    } else if (L.t < L.warn) {
      const k = L.t / L.warn;
      ctx.strokeStyle = L.blue ? C.ao : C.shu; ctx.globalAlpha = .35 + .5 * k; ctx.lineWidth = 1 + k * 2;
      ctx.setLineDash([10, 8]); ctx.lineDashOffset = -gt * 60;
      line(); ctx.setLineDash([]);
    } else {
      const k = Math.min(1, (L.warn + L.act - L.t) / .1) * (beamDark(L) ? .18 : 1);

      ctx.strokeStyle = C.washi; ctx.lineWidth = L.w * .3;
      line();
    }
    ctx.globalAlpha = 1;
  }

  for (const l of launchers) {
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a * .8);
    ctx.fillStyle = C.ai2; ctx.strokeStyle = C.washi; ctx.lineWidth = 2.5;
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * 16, Math.sin(a) * 16); } ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.fillStyle = l.next < .5 ? C.shu : C.kin; ctx.beginPath(); ctx.arc(l.x, l.y, 4.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.kin; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(l.x, l.y, 22, -Math.PI / 2, -Math.PI / 2 + TAU * l.hp / l.max); ctx.stroke();
  }

    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.fillStyle = C.ai2; ctx.strokeStyle = t.kind === 'r' ? C.shu : C.washi; ctx.lineWidth = 2;
    ctx.fillRect(-11, -11, 22, 22); ctx.strokeRect(-11, -11, 22, 22);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // marks: where a skill is about to come from, a gold ring closing on a point
  for (const m of marks) {
    const k = Math.max(0, 1 - m.t / Math.min(m.life, .8));
    const mc = m.col || C.kin;
    ctx.strokeStyle = mc; ctx.lineWidth = m.big ? 4 : 2; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.arc(m.x, m.y, 8 + 22 * k, 0, TAU); ctx.stroke();
    diamond(m.x, m.y, m.big ? 9 : 5); ctx.fillStyle = mc; ctx.fill();
    if (m.label) { ctx.font = '700 18px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.washi; ctx.fillText(m.label, m.x, m.y - 24); }
    ctx.globalAlpha = 1;
  }

    const crouch = B.mode === 'aim' || B.sink > 0 ? Math.sin(gt * 70) * 2 : 0;

    if (F.special.includes('invisible') && B.stagger <= 0 && !B.barrier) alpha = Math.max(.05, Math.min(1, B.vis * 1.4));

    }
    drawEnemy(bx, by, alpha, true);
    // wind-up: a gold ring closing on the body until the blow
    if (B.tell) {
      const k = Math.max(0, B.tell.t / B.tell.max);
      ctx.strokeStyle = C.kin; ctx.lineWidth = 2 + 2 * (1 - k); ctx.globalAlpha = .55 + .45 * (1 - k);
      ctx.beginPath(); ctx.arc(bx, by, B.r + 6 + 54 * k, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // the sign of what comes next, over the body while it waits
    if (B.sign && B.busy <= 0 && B.final !== 'on') {
      ctx.font = '700 20px ' + FD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = .9 * alpha; ctx.fillStyle = C.kin; ctx.fillText(B.sign, bx, by - B.r - 22); ctx.globalAlpha = 1;
    }
    if (F.special.includes('shield') && !B.barrier) {
      ctx.strokeStyle = C.washi; ctx.lineWidth = 5; ctx.globalAlpha = .85 * alpha;
      ctx.beginPath(); ctx.arc(bx, by, B.r + 14, B.shieldA - 1.1, B.shieldA + 1.1); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (B.stance > 0) {
      ctx.strokeStyle = C.kin; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(bx, by, B.r + 18, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    if (B.stagger > 0) {
      ctx.strokeStyle = C.kin; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx, by, B.r + 26, -Math.PI / 2, -Math.PI / 2 + TAU * (B.stagger / B.staggerMax)); ctx.stroke();
      ctx.globalAlpha = .25 + .15 * Math.sin(gt * 10); ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(bx, by, B.r + P.r + SLASH_REACH, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (B.barrier || B.seal || B.guard) {
      ctx.strokeStyle = B.seal ? C.mute : C.washi; ctx.lineWidth = 2; ctx.globalAlpha = .5 + .25 * Math.sin(gt * 6);
      for (let i = 0; i < 6; i++) { const a0 = -B.spin * .4 + i * TAU / 6; ctx.beginPath(); ctx.arc(bx, by, B.r + 20, a0, a0 + TAU / 6 - .18); ctx.stroke(); }
      ctx.globalAlpha = .07; ctx.fillStyle = C.washi; ctx.beginPath(); ctx.arc(bx, by, B.r + 20, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  for (const s of slashes) {
    const k = s.life / .22, c = Math.cos(s.a + Math.PI / 2), sn = Math.sin(s.a + Math.PI / 2), L = (s.r || B.r) + 30;
    ctx.globalAlpha = k; ctx.strokeStyle = C.kin; ctx.lineWidth = 5 * k + 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x - c * L, s.y - sn * L); ctx.lineTo(s.x + c * L, s.y + sn * L); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // player
  for (const a of after) { ctx.globalAlpha = a.a; ctx.fillStyle = C.kin; ctx.beginPath(); ctx.arc(a.x, a.y, P.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (!P.dead && !(P.inv > 0 && P.dashT <= 0 && Math.floor(gt * 14) % 2)) {
    if (P.parryT > 0) {
      const k = P.parryT / PARRY_WIN;
      ctx.strokeStyle = C.kin; ctx.globalAlpha = .35 + .65 * k; ctx.lineWidth = 2 + 2 * k;
      ctx.beginPath(); ctx.arc(P.x, P.y, P.r + PARRY_R, 0, TAU); ctx.stroke();
      ctx.globalAlpha = .12 * k; ctx.fillStyle = C.kin; ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = P.parryCD > 0 || parrySealed() ? C.mute : C.washi;
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, TAU); ctx.fill();
    if (fx.rev > 0) { ctx.strokeStyle = C.shu; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 3, 0, TAU); ctx.stroke(); }
    ctx.strokeStyle = C.kin; ctx.lineWidth = 2.5; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(P.x + P.fx * (P.r + 2), P.y + P.fy * (P.r + 2)); ctx.lineTo(P.x + P.fx * (P.r + 10), P.y + P.fy * (P.r + 10)); ctx.stroke();
    if (P.dashCD > 0 && !dashSealed()) {
      ctx.strokeStyle = C.mute; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - P.dashCD / DASH_CD)); ctx.stroke();
    }
  }

  // bullets
  for (const b of bullets) {
    let a = 1;
    if (b.ghost && b.own === 'b') { const d = Math.hypot(b.x - P.x, b.y - P.y); a = b.age < .35 ? 1 : d < 120 ? 1 - (d - 60) / 60 : 0; a = clamp(a, 0, 1); if (a <= .02) continue; }
    if (b.own === 'b' && blinkOff(b)) a = .18;
    ctx.globalAlpha = a;
    if (b.own === 'p') {
      ctx.strokeStyle = C.kin; ctx.lineWidth = b.perfect ? 4 : 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * .035, b.y - b.vy * .035); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = C.kin; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1, 0, TAU); ctx.fill();
    } else if (b.mine) {
      const blink = b.mine < 1 && Math.floor(gt * 10) % 2;
      ctx.strokeStyle = C.shu; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, TAU); ctx.stroke();
      ctx.fillStyle = blink ? C.washi : C.shu; ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, TAU); ctx.fill();
    } else if (b.needle) {
      const s = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / s, uy = b.vy / s;
      ctx.strokeStyle = b.kind === 'w' ? C.washi : b.kind === 'b' ? C.ao : C.shu; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x - ux * 12, b.y - uy * 12); ctx.lineTo(b.x + ux * 6, b.y + uy * 6); ctx.stroke();
    } else if (b.kind === 'b') {
      // 蒼弾: a hollow blue ring, unlike the white disc and the red diamond
      ctx.strokeStyle = C.ao; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
      ctx.fillStyle = C.ao; ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, TAU); ctx.fill();
    } else if (b.kind === 'w') {
      ctx.fillStyle = C.washi;
      ctx.globalAlpha = .22 * a; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, 0, TAU); ctx.fill();
      ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      if (b.big) { ctx.strokeStyle = C.ai; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .55 + Math.sin(gt * 12) * 2, 0, TAU); ctx.stroke(); }
      else if (b.fake) { ctx.fillStyle = C.shu; ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, TAU); ctx.fill(); }
      else if (b.home > 0 || b.stop || b.sp3) { ctx.fillStyle = C.ai; ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, TAU); ctx.fill(); }
    } else {
      if (b.big) {
        ctx.fillStyle = C.shu; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
        ctx.strokeStyle = C.ai; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .55 + Math.sin(gt * 12) * 2, 0, TAU); ctx.stroke();
      } else {
        ctx.fillStyle = C.shu; diamond(b.x, b.y, b.r + 2); ctx.fill();
        ctx.fillStyle = C.ai; diamond(b.x, b.y, b.r - 3.5); ctx.fill();
        if (b.sp3) { ctx.fillStyle = C.washi; ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, TAU); ctx.fill(); }
      }
    }
    if (b.sealHit && b.own === 'b') { ctx.strokeStyle = C.murasaki; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, TAU); ctx.stroke(); }
    // the enemy's own shot wears a thin gold ring; a shot about to change colour shows the colour it will turn
    if (b.own === 'b' && b.sig) { ctx.strokeStyle = C.kin; ctx.globalAlpha = .6 * a; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, TAU); ctx.stroke(); ctx.globalAlpha = a; }
    if (b.own === 'b' && b.shift) { ctx.strokeStyle = b.shift.to === 'r' ? C.shu : C.washi; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    ctx.globalAlpha = 1;
  }
  // 墨: clouds that hide whatever passes under them
  for (const k of inks) {
    const a = Math.min(1, k.t * 3, k.life);
    const g = ctx.createRadialGradient(k.x, k.y, k.r * .3, k.x, k.y, k.r);
    g.addColorStop(0, `rgba(6,10,20,${.95 * a})`); g.addColorStop(1, 'rgba(6,10,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, TAU); ctx.fill();
  }

  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life / .4); ctx.fillStyle = t.col; ctx.font = `800 ${t.size}px ${FD}`; ctx.fillText(t.txt, t.x, t.y); }
  ctx.globalAlpha = 1;

  // darkness: only a pool of light around the player
  if (fx.dark > 0 || RL.dark) {
    const k = RL.dark ? 1 : Math.min(1, fx.dark * 2, (5.5 - fx.dark) * 3 + .2);
    const g = ctx.createRadialGradient(P.x, P.y, 80, P.x, P.y, 175);
    g.addColorStop(0, 'rgba(6,10,20,0)'); g.addColorStop(1, `rgba(6,10,20,${.97 * k})`);
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  if (fx.freeze > 0) { ctx.fillStyle = 'rgba(143,154,176,0.10)'; ctx.fillRect(0, 0, W, H); }
  if (RUN && RUN.st && RUN.st.n === 150 && !RUN.st.free && B.final === 'on') {
    const g = ctx.createRadialGradient(W / 2, H / 2, 220, W / 2, H / 2, 560);
    g.addColorStop(0, 'rgba(228,87,63,0)'); g.addColorStop(1, `rgba(228,87,63,${.22 + .08 * Math.sin(gt * 2)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  if (flash > 0) { ctx.globalAlpha = flash * .5; ctx.fillStyle = C.washi; ctx.fillRect(0, 0, SW, SH); ctx.globalAlpha = 1; }
  if (!RUN) return;

  // HUD: off-screen. The enemy's direction, and every warning outside the view, as marks on the screen's edge
  {
    const z = cam.z, vx0 = cam.x, vy0 = cam.y, vx1 = cam.x + SW / z, vy1 = cam.y + SH / z;
    const toScreen = (x, y) => [(x - cam.x) * z, (y - cam.y) * z];
    const out = (x, y) => x < vx0 || x > vx1 || y < vy0 || y > vy1;
    const edgeMark = (x, y, col, size) => {
      const [sx, sy] = toScreen(x, y), cx = SW / 2, cy = SH / 2, a = Math.atan2(sy - cy, sx - cx);
      // where the line from the middle of the screen to the point leaves the screen
      const m = 18, kx = Math.cos(a) ? ((Math.cos(a) > 0 ? SW - m : m) - cx) / Math.cos(a) : 1e9, ky = Math.sin(a) ? ((Math.sin(a) > 0 ? SH - m : m) - cy) / Math.sin(a) : 1e9, k = Math.min(Math.abs(kx), Math.abs(ky));
      const ex = cx + Math.cos(a) * k, ey = cy + Math.sin(a) * k;
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * .7, size * .75); ctx.lineTo(-size * .7, -size * .75); ctx.closePath();
      ctx.fillStyle = col; ctx.fill(); ctx.restore();
    };
    ctx.globalAlpha = .9;
    for (const zn of zones) if (zn.t < zn.warn && out(zn.x, zn.y)) edgeMark(zn.x, zn.y, C.shu, 7);
    for (const L of lasers) if (L.t < L.warn && out(L.x, L.y)) edgeMark(L.x, L.y, L.blue ? C.ao : C.shu, 8);
    for (const m of marks) if (out(m.x, m.y)) edgeMark(m.x, m.y, m.col || C.kin, 7);
    ctx.globalAlpha = 1;
    if (!stats.won && !B.out && !B.fall && out(B.x, B.y)) { edgeMark(B.x, B.y, B.mode === 'aim' || B.mode === 'dash' ? C.shu : C.washi, 13); }
  }

  // HUD: enemy life, a thick bar across the top with the life left in figures
  const x0 = 150, bw = SW - 300, y0 = 14, bh = 16;
  ctx.fillStyle = 'rgba(8,13,24,.75)'; ctx.fillRect(x0 - 4, y0 - 4, bw + 8, bh + 8);
  ctx.fillStyle = C.line; ctx.fillRect(x0, y0, bw, bh);
  if (RL.survive || sealForm()) {
    const k = RL.survive ? stats.time / RL.survive : B.formT / F.surviveT;
    ctx.fillStyle = C.kin; ctx.fillRect(x0, y0, bw * Math.min(1, k), bh);
  } else {
    const tot = totalHp();
    ctx.fillStyle = B.stagger > 0 ? C.kin : B.seal || B.barrier ? C.mute : C.shu; ctx.fillRect(x0, y0, bw * clamp(B.hp / tot, 0, 1), bh);
    ctx.font = `600 13px ${FM}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.washi;
    ctx.fillText(Math.max(0, Math.round(B.hp * HPDISP)).toLocaleString('en-US') + ' / ' + Math.round(tot * HPDISP).toLocaleString('en-US'), x0 + bw / 2, y0 + bh / 2 + 1);
  }
  for (let i = 0; i < forms.length; i++) { diamond(x0 + bw + 16 + i * 13, y0 + bh / 2, 4.5); if (i >= fi) { ctx.fillStyle = C.washi; ctx.fill(); } else { ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke(); } }
  if (B.final === 'on') {
    ctx.fillStyle = C.line; ctx.fillRect(x0, y0 + bh + 4, bw, 5);
    ctx.fillStyle = C.washi; ctx.fillRect(x0, y0 + bh + 4, bw * Math.max(0, 1 - B.finalT / B.finalLen), 5);
  }
  ctx.textBaseline = 'middle'; ctx.textAlign = 'right'; ctx.fillStyle = B.final === 'on' ? C.shu : C.washi; ctx.font = `800 17px ${FD}`;
  ctx.fillText(B.final === 'on' ? '終ノ型' : F.name, x0 - 12, y0 + bh / 2);
  ctx.textAlign = 'left'; ctx.font = `800 15px ${FD}`; ctx.fillStyle = C.mute;
  ctx.fillText(RUN.st.name, 14, y0 + bh / 2);
  ctx.textAlign = 'right'; ctx.font = `500 15px ${FM}`;
  if (RL.limit) { const left = Math.max(0, RL.limit - stats.time); ctx.fillStyle = left < 15 ? C.shu : C.washi; ctx.fillText('残 ' + fmt(left), SW - 14, y0 + bh / 2); }
  else if (RL.survive) { ctx.fillStyle = C.washi; ctx.fillText('残 ' + fmt(Math.max(0, RL.survive - stats.time)), SW - 14, y0 + bh / 2); }
  else { ctx.fillStyle = C.mute; ctx.fillText(fmt(stats.time), SW - 14, y0 + bh / 2); }

  // HUD: what the enemy says, the string of skills it is running, its great techniques: large across the top
  if (call) {
    const a = Math.max(0, Math.min(1, call.t / .35, (call.max - call.t) / .15 + .3));
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 ${call.size}px ${FD}`; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(8,13,24,.85)';
    ctx.strokeText(call.txt, SW / 2, 62); ctx.fillStyle = call.col; ctx.fillText(call.txt, SW / 2, 62);
    ctx.globalAlpha = 1;
  }

  // HUD: the player. lives, a thick life bar with figures, and the stamina for the big dash
  {
    const px = 16, py = SH - 58, pw = 230;
    ctx.fillStyle = 'rgba(8,13,24,.75)'; ctx.fillRect(px - 6, py - 22, pw + 12, 60);
    for (let i = 0; i < P.maxLives; i++) { diamond(px + 7 + i * 18, py - 10, 6); if (i < P.lives) { ctx.fillStyle = C.shu; ctx.fill(); } else { ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.stroke(); } }
    ctx.fillStyle = C.line; ctx.fillRect(px, py, pw, 14);
    const hk = clamp(P.hp / P.max, 0, 1);
    ctx.fillStyle = hk < .3 ? C.shu : C.washi; ctx.fillRect(px, py, pw * hk, 14);
    // the life coming back
    if (!P.dead && P.hp < P.max && gt - P.lastHurt > REGEN_WAIT) { ctx.fillStyle = C.kin; ctx.globalAlpha = .5 + .3 * Math.sin(gt * 8); ctx.fillRect(px + pw * hk - 2, py, 3, 14); ctx.globalAlpha = 1; }
    ctx.font = `600 12px ${FM}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.ai;
    ctx.fillText(Math.ceil(P.hp) + ' / ' + P.max, px + pw - 4, py + 7.5);
    ctx.fillStyle = C.line; ctx.fillRect(px, py + 19, pw, 7);
    ctx.fillStyle = P.stam >= BIG_COST ? C.ao : C.mute; ctx.fillRect(px, py + 19, pw * P.stam / STAM_MAX, 7);
    for (let k = BIG_COST; k < STAM_MAX; k += BIG_COST) { ctx.fillStyle = 'rgba(8,13,24,.9)'; ctx.fillRect(px + pw * k / STAM_MAX - 1, py + 19, 2, 7); }
    if (look) { ctx.textAlign = 'left'; ctx.font = `800 13px ${FD}`; ctx.fillStyle = C.kin; ctx.fillText('見渡し', px + pw + 14, py + 8); }
  }
  const chips = [];
  if (sealForm() && !RL.survive) chips.push(['封 弾', F.surviveT - B.formT]); else if (sealForm()) chips.push(['封 弾', 0]); else if (finalSeal('P')) chips.push(['封 弾', finalSealLeft()]); else if (fx.sealP > 0) chips.push(['封 弾', fx.sealP]);
  if (slashSealed()) chips.push(['封 斬', 0]);
  if (F.special.includes('sealDform')) chips.push(['封 踏', 0]); else if (finalSeal('D')) chips.push(['封 踏', finalSealLeft()]); else if (fx.sealD > 0) chips.push(['封 踏', fx.sealD]);
  if (fx.rev > 0) chips.push(['逆さ', fx.rev]);
  if (fx.swap > 0) chips.push(['反転', fx.swap]);
  if (RL.perfectOnly) chips.push(['極のみ', 0]);
  if (B.seal && stones) chips.push(['封印 次:' + '壱弐参'[stones.next - 1], 0]);
  ctx.font = `800 14px ${FD}`; ctx.textAlign = 'left';
  let cx = 260;
  for (const [t, v] of chips) {
    const label = v ? `${t} ${v.toFixed(1)}` : t, w = ctx.measureText(label).width + 16;
    ctx.strokeStyle = C.shu; ctx.lineWidth = 1; ctx.strokeRect(cx, SH - 34, w, 20);
    ctx.fillStyle = C.shu; ctx.fillText(label, cx + 8, SH - 23); cx += w + 6;
  }
  if (P.combo >= 2) {
    ctx.textAlign = 'right'; ctx.fillStyle = C.kin; ctx.font = `800 24px ${FD}`;
    ctx.fillText(P.combo + ' 連', SW - 18, SH - 30);
    ctx.font = `500 13px ${FM}`; ctx.fillStyle = C.mute;
    ctx.fillText('威力 ×' + mult().toFixed(2), SW - 18, SH - 10);
  }

  if (banner) {
    const a = Math.min(1, banner.t / .4, (1.6 - banner.t) / .2 + .2);
    ctx.globalAlpha = Math.max(0, a); ctx.textAlign = 'center';
    ctx.fillStyle = C.washi; ctx.font = `800 60px ${FD}`; ctx.fillText(banner.txt, SW / 2, SH * .5);
    ctx.fillStyle = C.kin; ctx.save(); ctx.translate(SW / 2, SH * .5 + 4); ctx.rotate(-.12); ctx.fillRect(-150, -1, 300, 2); ctx.restore();
    if (banner.sub) { ctx.font = `800 20px ${FD}`; ctx.fillStyle = C.kin; ctx.fillText(banner.sub, SW / 2, SH * .5 + 54); }
    ctx.globalAlpha = 1;
  }
}

// =====================================================================
// screens
// =====================================================================
const VERSION = '0.2.0';
let selN = 1, life = 0, freeDiff = 1, tempUnlock = false;
const bestTime = c => Math.min(...LIFE_TK.map(k => c[k] || Infinity));
const bestScore = c => Math.max(0, ...(c.hs || []));
const keysBar = $('.keys');
function show(html) { ov.innerHTML = html; ov.hidden = false; ov.scrollTop = 0; keysBar.hidden = state !== 'title'; }
function hideOv() { ov.hidden = true; ov.innerHTML = ''; }
const nClear = () => Object.keys(save.clr).length;

// ---- 続きから: browsers may throw a background tab away and reload it, so a run in progress is checkpointed ----
const RESUME_KEY = 'kaeshiba.next.resume';
let resumeData = null, lastCheckpoint = 0;
function saveResume() {
  if (!RUN || ending || P.dead || (state !== 'play' && state !== 'pause')) return;
  // free play keeps the seed of the enemy it drew, so the same one comes back
  const d = { at: Date.now(), run: { mode: RUN.mode, n: RUN.st ? RUN.st.n : 0, life: RUN.life || 0, diff: RUN.diff || 0, seed: RUN.st && RUN.st.free ? RUN.st.finalSeed : undefined },
              fi, bhp: B.hp, php: P.hp, plives: P.lives, final: B.final, revived: B.revived, sealDone: B.sealDone, formT: B.formT, stats };
  try { localStorage.setItem(RESUME_KEY, JSON.stringify(d)); } catch (e) {}
}
function clearResume() { resumeData = null; try { localStorage.removeItem(RESUME_KEY); } catch (e) {} }
function loadResume() {
  try { const d = JSON.parse(localStorage.getItem(RESUME_KEY) || 'null'); if (d && Date.now() - d.at < 24 * 3600e3) return d; } catch (e) {}
  return null;
}
function resumeLabel(d) {
  const where = d.run.mode === 'stage' ? `${stageByN(d.run.n).name}${d.run.life ? ' ・' + LIFE[d.run.life].name : ''}` : `自由稽古 ${FREE[d.run.diff].name}`;
  const form = d.final === 'on' ? '終ノ型' : ['一ノ型', '二ノ型', '三ノ型', '四ノ型', '五ノ型', '六ノ型'][d.fi] || '';
  return `${where} ・ ${form} ・ 命 ${d.php}`;
}
function continueRun(d) {
  startRun(d.run.mode === 'stage' ? { mode: 'stage', st: stageByN(d.run.n), life: d.run.life }
    : { mode: 'free', diff: d.run.diff, st: d.run.seed !== undefined ? buildStage(FREE[d.run.diff].lv, { free: true, seed: d.run.seed }) : undefined });
  // walk forward to the saved form; its attacks start fresh, the damage done so far is kept
  while (fi < d.fi && fi < forms.length - 1) { fi++; F = forms[fi]; B.phase = fi + 1; setupForm(); }
  B.hp = Math.max(1, d.bhp); P.hp = Math.max(1, d.php); if (d.plives) P.lives = d.plives; Object.assign(stats, d.stats); stats.won = false;
  B.revived = !!d.revived; B.formT = d.formT || 0; B.sealDone = !!d.sealDone;
  if (d.final === 'on') { B.hp = 1; startFinal(); }
  else { if (d.final === 'done') { B.final = 'done'; B.hp = 1; } banner = { txt: '続き', sub: F.name, t: 1.2 }; }
}
function titleScreen() {
  playSong('title'); setSongLevel(9);
  resumeData = loadResume();
  state = 'title'; RUN = null;
  show(`<div class="panel">
    <p class="eyebrow">弾 ・ 踏 ・ 斬</p>
    <h2 class="logo">返し刃<small>試作</small></h2>
    <ul class="rules">
      <li><b class="k-w">● 白い弾</b>は当たる直前に<b class="k-g">弾き</b>で跳ね返せる。引きつけるほど<b class="k-g">「極」</b>。</li>
      <li><b class="k-r">◆ 朱い弾</b>・朱い光線・落雷は弾けない。<b>踏み込み</b>の無敵で抜けるか、かわす。<b class="k-b">○ 青</b>は踏み込みでも抜けられない。</li>
      <li>弾きの届く距離に鬼がいれば、弾くと同時に<b>斬る</b>。突進を弾けば鬼が<b class="k-g">崩れ</b>、斬れば大きく削れる。</li>
      <li><b>小踏み込み</b>はその場をかわす一歩。<b>大踏み込み</b>は大技や速い一撃を遠くまで抜けるが、息（青い棒）を使う。<b>見渡し</b>の間は遠くまで見えるが足が遅い。</li>
      <li>体力は一つの命に50。しばらく当たらなければ戻る。尽きれば命を一つ失い、その場で立ち直る。通常は命5、決死は3、泡沫は1で一撃でも終わり。</li>
      <li>場は画面より広い。見えない所の鬼と攻めは、画面の端の印が教える。見て、覚えて、破れ。</li>
    </ul>
    <div class="modes">
      ${resumeData ? `<button type="button" class="mode" data-act="continue"><b>続きから</b><span>${resumeLabel(resumeData)}</span></button>` : ''}
      <button type="button" class="mode" data-act="select"><b>番付</b><span>討伐 ${nClear()}</span></button>
    </div>
  </div>
  <p class="ver">ver ${VERSION}</p>`);
}
// keepUnlock: only the Ctrl+D+B chord keeps every stage open; any other return to 番付 closes them again
function selectScreen(keepUnlock) {
  state = 'select';
  if (!keepUnlock) tempUnlock = false;
  const cells = STAGES.map(s => {
    const c = save.clr[s.n], ok = unlocked(s.n);
    const cls = ['cell', c ? (c.u ? 'uta' : c.k ? 'kes' : c.t ? 'clr' : 'easy') : '', s.n === selN ? 'cur' : ''].join(' ');
    const rec = c ? `<small>${bestTime(c) < Infinity ? fmt(bestTime(c)) : '―'}</small><small>${bestScore(c) || '―'}</small>` : '';
    return `<button type="button" class="${cls}" data-act="pick" data-v="${s.n}" ${ok ? '' : 'disabled'} aria-label="${ok ? s.name : '未解放'}">${ok ? s.name : '？'}${rec}</button>`;
  }).join('');
  show(`<div class="panel wide">
    <div class="row" style="justify-content:space-between"><h2 class="head">番付</h2><div class="row"><button type="button" class="ghost" data-act="transfer">引き継ぎ</button><button type="button" class="ghost" data-act="title">戻る</button></div></div>
    <p class="best">討伐 ${nClear()}</p>
    <div class="grid">${cells}</div>
  </div>`);
  const cur = ov.querySelector('.cell.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
}
// ---- 引き継ぎ: the clear record as a code to carry between sites, apps and devices ----
const CODE_TAG = 'KN1:';
function recordCode() {
  const r2 = v => v ? Math.round(v * 100) / 100 : 0, clr = {};
  for (const n in save.clr) { const c = save.clr[n]; clr[n] = { t: r2(c.t), kt: r2(c.kt), ut: r2(c.ut), et: r2(c.et), k: c.k ? 1 : 0, u: c.u ? 1 : 0, hs: c.hs || [] }; }
  const free = {}; for (const d in save.free || {}) free[d] = r2(save.free[d]);
  return CODE_TAG + btoa(JSON.stringify({ clr, free, freeHS: save.freeHS || {} }));
}
function readCode(text) {
  const s = (text || '').replace(/\s+/g, '');
  if (!s.startsWith(CODE_TAG)) return null;
  let r;
  try { r = JSON.parse(atob(s.slice(CODE_TAG.length))); } catch (e) { return null; }
  if (!r || typeof r.clr !== 'object') return null;
  // only numbers for known stages and levels come through
  const num = v => (typeof v === 'number' && isFinite(v) && v > 0 ? v : 0);
  const out = { clr: {}, free: {}, freeHS: {} };
  for (const k in r.clr) {
    const n = +k, c = r.clr[k] || {};
    if (!STAGES.some(s => s.n === n)) continue;
    const e = { t: num(c.t), kt: num(c.kt), ut: num(c.ut), et: num(c.et), k: c.k ? 1 : 0, u: c.u ? 1 : 0, hs: [0, 1, 2, 3].map(i => Math.round(num((c.hs || [])[i]))) };
    // a stage counts as cleared only with a time in some mode
    if (e.t || e.kt || e.ut || e.et) out.clr[n] = e;
  }
  for (let d = 0; d < FREE.length; d++) { out.free[d] = num((r.free || {})[d]); out.freeHS[d] = Math.round(num((r.freeHS || {})[d])); }
  return out;
}
function transferScreen() {
  state = 'transfer';
  show(`<div class="panel">
    <h2 class="head">引き継ぎ</h2>
    <textarea id="tcode" class="code" readonly rows="4">${recordCode()}</textarea>
    <div class="row"><button type="button" class="primary" data-act="copycode">写す</button><span class="hint" id="tcopied" aria-live="polite"></span></div>
    <textarea id="tin" class="code" rows="4" placeholder="${CODE_TAG}…" aria-label="引き継ぎコード"></textarea>
    <div class="row"><button type="button" class="primary" data-act="importcode">読み込む</button><button type="button" class="ghost" data-act="select">番付へ</button><span class="hint" id="tmsg" aria-live="polite"></span></div>
  </div>`);
}
function detailScreen(n) {
  state = 'detail'; selN = n;
  const s = stageByN(n), c = save.clr[n];
  show(`<div class="panel">
    <h2 class="head">${s.name}</h2>
    <div class="seg" role="group" aria-label="命">
      ${LIFE_ORDER.map(i => `<button type="button" data-act="life" data-v="${i}" aria-pressed="${i === life}">${LIFE[i].name}</button>`).join('')}
    </div>
    <dl class="stats">
      ${LIFE_ORDER.map(i => `<dt>${LIFE[i].name}</dt><dd>${c && c[LIFE_TK[i]] ? fmt(c[LIFE_TK[i]]) : '―'} ・ ${c && c.hs && c.hs[i] ? c.hs[i] : '―'}</dd>`).join('')}
    </dl>
    <div class="row"><button type="button" class="primary" data-act="go">挑む</button>
      ${prevOf(n) ? `<button type="button" class="ghost" data-act="pick" data-v="${prevOf(n).n}">前の鬼</button>` : ''}
      ${nextOf(n) && unlocked(nextOf(n).n) ? `<button type="button" class="ghost" data-act="pick" data-v="${nextOf(n).n}">次の鬼</button>` : ''}
      <button type="button" class="ghost" data-act="select">番付へ</button></div>
  </div>`);
}
function freeScreen() {
  state = 'freeSel';
  show(`<div class="panel">
    <h2 class="head">自由稽古</h2>
    <div class="seg" role="group" aria-label="難易度">
      ${FREE.map((d, i) => `<button type="button" data-act="fdiff" data-v="${i}" aria-pressed="${i === freeDiff}">${d.name}<small>第${d.lv}番</small></button>`).join('')}
    </div>
    <p class="dnote">毎回ちがう鬼が出る。命は阿修羅のみ3。</p>
    <div class="row"><button type="button" class="primary" data-act="gofree">始める</button><button type="button" class="ghost" data-act="title">戻る</button></div>
    <dl class="stats">
      ${FREE.map((d, i) => `<dt>${d.name}</dt><dd>${save.free[i] ? fmt(save.free[i]) : '―'} ・ ${(save.freeHS || {})[i] || '―'}</dd>`).join('')}
    </dl>
  </div>`);
}
function startRun(run) {
  ensureAudio(); newGame(run); hideOv();
  song = null; playSong(run.st.song || 'battle'); setSongLevel(0, 1);
  state = 'play';
  banner = { txt: run.st.name, t: 1.5 };
  if (run.st.intro) say(run.st.intro, { t: 3 });
  keysBar.hidden = true;
  if (run.mode === 'stage') { save.tried[run.st.n] = 1; persist(); }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  last = performance.now();
}
const retry = () => startRun(Object.assign({}, RUN));
function pause() {
  if (state !== 'play' || ending) return;
  state = 'pause';
  show(`<div class="panel"><h2 class="head">一時停止</h2>
    <div class="row"><button type="button" class="primary" data-act="resume">再開</button>
    <button type="button" class="ghost" data-act="retry">やり直す</button>
    <button type="button" class="ghost" data-act="${RUN.mode === 'stage' ? 'select' : 'free'}">${RUN.mode === 'stage' ? '番付へ' : '難易度へ'}</button></div></div>`);
}
function resume() { if (state !== 'pause') return; hideOv(); state = 'play'; last = performance.now(); }
// out of 10000: remaining life carries half of it; speed is measured against a par for this enemy's total life
function scoreOf(s) {
  // lives left count for most, then the life in the last one
  const life = P.maxLives ? (Math.max(0, P.lives - 1) + P.hp / P.max) / P.maxLives : 0;
  const totalHp = forms.reduce((a, f) => a + f.hp, 0);
  const par = RL.survive ? s.time : totalHp / 2.6 +(B.final ? B.finalLen : 0) + forms.length * 2;
  const speed = clamp(par / Math.max(1, s.time), 0, 1);
  const perfect = s.parries ? s.perfects / s.parries : 0;
  const combo = Math.min(1, s.maxCombo / 20), cut = Math.min(1, s.slashes / 8);
  return Math.round(5000 * life + 2000 * speed + 1500 * perfect + 1000 * combo + 500 * cut);
}
function showResult() {
  stopSong();
  state = 'over';
  clearResume();
  for (const id of seenNow) if (!save.seen.includes(id)) save.seen.push(id);
  const s = stats, won = s.won;
  const sc = scoreOf(s);
  let newTime = false, newScore = false, bestT = 0, bestS = 0;
  const lf = RUN.life || 0, TK = LIFE_TK;
  if (RUN.mode === 'stage') {
    const n = RUN.st.n, c = save.clr[n] || {};
    if (won) {
      if (lf === 2) c.u = 1;
      if (lf === 1 || lf === 2) c.k = 1;
      if (!c[TK[lf]] || s.time < c[TK[lf]]) { c[TK[lf]] = s.time; newTime = true; }
      c.hs = c.hs || [0, 0, 0, 0];
      if (sc > c.hs[lf]) { c.hs[lf] = sc; newScore = true; }
      save.clr[n] = c;
    }
    const cc = save.clr[n] || {};
    bestT = cc[TK[lf]] || 0; bestS = (cc.hs || [])[lf] || 0;
  } else {
    save.freeHS = save.freeHS || {};
    if (won) {
      if (!save.free[RUN.diff] || s.time < save.free[RUN.diff]) { save.free[RUN.diff] = s.time; newTime = true; }
      if (sc > (save.freeHS[RUN.diff] || 0)) { save.freeHS[RUN.diff] = sc; newScore = true; }
    }
    bestT = save.free[RUN.diff] || 0; bestS = save.freeHS[RUN.diff] || 0;
  }
  persist(); if (won) pushCloud();
  const rank = !won ? '' : sc >= 8500 ? 'S' : sc >= 7000 ? 'A' : sc >= 5500 ? 'B' : sc >= 4000 ? 'C' : 'D';
  const label = RUN.mode === 'stage' ? `${RUN.st.name}${RUN.life ? ' ・' + LIFE[RUN.life].name : ''}` : `自由稽古 ${FREE[RUN.diff].name}`;
  const nextBtn = RUN.mode === 'stage' && won && nextOf(RUN.st.n) ? `<button type="button" class="primary" data-act="next">次の鬼へ</button>` : '';
  show(`<div class="panel">
    <p class="eyebrow">${label}</p>
    <div class="res-head"><h2 class="head">${won ? '討ち取った' : '敗れた'}</h2>
      ${won ? `<div class="rank">${rank}</div>` : s.why ? `<div class="rank lost">${s.why}</div>` : ''}</div>
    ${won ? `<p class="score">${sc}</p>` : ''}
    <dl class="stats">
      <dt>最高得点</dt><dd>${bestS || '―'}${newScore ? ' <span class="k-g">更新</span>' : ''}</dd>
      <dt>最速</dt><dd>${bestT ? fmt(bestT) : '―'}${newTime ? ' <span class="k-g">更新</span>' : ''}</dd>
    </dl>
    <div class="row">${nextBtn}<button type="button" class="${nextBtn ? 'ghost' : 'primary'}" data-act="retry">もう一度</button>
      <button type="button" class="ghost" data-act="${RUN.mode === 'stage' ? 'select' : 'free'}">${RUN.mode === 'stage' ? '番付へ' : '難易度へ'}</button></div>
  </div>`);
}
ov.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act;
  // leaving a run from the pause menu abandons it
  if (state === 'pause' && (act === 'select' || act === 'free' || act === 'title')) clearResume();
  if (act === 'continue') { if (resumeData) continueRun(resumeData); return; }
  if (act === 'title') titleScreen();
  else if (act === 'select') selectScreen();
  else if (act === 'pick') detailScreen(+a.dataset.v);
  else if (act === 'go') startRun({ mode: 'stage', st: stageByN(selN), life });
  else if (act === 'life') { life = +a.dataset.v; ov.querySelectorAll('[data-act="life"]').forEach(b => b.setAttribute('aria-pressed', String(b === a))); }
  else if (act === 'free') freeScreen();
  else if (act === 'fdiff') { freeDiff = +a.dataset.v; ov.querySelectorAll('[data-act="fdiff"]').forEach(b => b.setAttribute('aria-pressed', String(b === a))); }
  else if (act === 'gofree') startRun({ mode: 'free', diff: freeDiff });
  else if (act === 'retry') retry();
  else if (act === 'resume') resume();
  else if (act === 'next') { selN = nextOf(RUN.st.n).n; detailScreen(selN); }
  else if (act === 'transfer') transferScreen();
  else if (act === 'copycode') {
    const ta = ov.querySelector('#tcode'), msg = ov.querySelector('#tcopied');
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = '選択しました'; };
    try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = '写しました'; }, fallback); } catch (e) { fallback(); }
  }
  else if (act === 'importcode') {
    const r = readCode(ov.querySelector('#tin').value), msg = ov.querySelector('#tmsg');
    if (!r) { msg.textContent = 'コードが正しくありません'; return; }
    // the better of the two records is kept for every stage
    mergeRecords(r); persist(); pushCloud();
    ov.querySelector('#tcode').value = recordCode();
    msg.textContent = `読み込みました（討伐 ${nClear()}）`;
  }
});

// keyboard
const MOVE = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
// Z parries (and cuts, when the enemy is in reach); X the short dash for the moment's dodge; C the big dash
// for great techniques and fast blows; V held widens the view
const PARRY = new Set(['KeyZ']), DASH = new Set(['KeyX']), BIG = new Set(['KeyC']), CUT = new Set();
const LOOK = new Set(['KeyV']);
addEventListener('keydown', e => {
  // the first key or tap wakes the sound (browsers keep it asleep until then)
  if (!song && state !== 'play') { ensureAudio(); if (state === 'title') playSong('title'); }
  // typing into the 引き継ぎ boxes is not a game key
  if (e.target && e.target.tagName === 'TEXTAREA') return;
  const c = e.code;
  if (state === 'play' && (MOVE.has(c) || PARRY.has(c) || DASH.has(c) || BIG.has(c) || CUT.has(c) || LOOK.has(c))) e.preventDefault();
  keys[c] = true;
  const ctrl = e.ctrlKey || keys.ControlLeft || keys.ControlRight;
  if (ctrl && (c === 'KeyD' || c === 'KeyB')) e.preventDefault();
  // Ctrl+D+B together opens every stage until the next ordinary return to 番付
  if (ctrl && keys.KeyD && keys.KeyB && state !== 'play' && state !== 'pause') { tempUnlock = true; selectScreen(true); return; }
  if (e.repeat) return;
  if (c === 'KeyM' && !ctrl) { toggleMute(); return; }
  if (state === 'play') {
    if (PARRY.has(c)) input.parry = true;
    else if (DASH.has(c)) input.dash = true;
    else if (BIG.has(c)) input.big = true;
    else if (CUT.has(c)) input.slash = true;
    else if (c === 'Escape' || c === 'KeyP') pause();
    else if (c === 'KeyR') retry();
  } else if (state === 'pause') {
    if (c === 'Escape' || c === 'KeyP') resume(); else if (c === 'KeyR') retry();
  } else if (state === 'detail') {
    if (c === 'Enter') { e.preventDefault(); startRun({ mode: 'stage', st: stageByN(selN), life }); }
    else if (c === 'Escape') selectScreen();
  } else if (state === 'over') {
    if (c === 'Enter' || c === 'KeyR') { e.preventDefault(); retry(); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); saveResume(); } });
addEventListener('pagehide', saveResume);

cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || state !== 'play') return;
  if (e.button === 0) input.parry = true; else if (e.button === 2) input.dash = true; else if (e.button === 1) { e.preventDefault(); input.big = true; }
});
cv.addEventListener('contextmenu', e => e.preventDefault());
// phones: a long press or a slide off the pad must not start a text selection or open the press menu
document.addEventListener('selectstart', e => { if (!e.target.closest || !e.target.closest('textarea')) e.preventDefault(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('#touch, #stage')) e.preventDefault(); });
$('#touch').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
$('#touch').addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

if (coarse) $('#touch').hidden = false;
const pad = $('#pad'), knob = $('#knob');
let padId = null, padC = { x: 0, y: 0 };
function padMove(e) {
  let dx = e.clientX - padC.x, dy = e.clientY - padC.y;
  const R = pad.clientWidth / 2 - 12, l = Math.hypot(dx, dy);
  if (l > R) { dx *= R / l; dy *= R / l; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  if (Math.hypot(dx, dy) / R < .18) { touchMv.x = touchMv.y = 0; } else { touchMv.x = dx / R; touchMv.y = dy / R; }
}
pad.addEventListener('pointerdown', e => {
  padId = e.pointerId; pad.setPointerCapture(e.pointerId);
  const r = pad.getBoundingClientRect(); padC = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  padMove(e); e.preventDefault();
});
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
const padEnd = e => { if (e.pointerId === padId) { padId = null; touchMv.x = touchMv.y = 0; knob.style.transform = ''; } };
pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);
$('#bParry').addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') input.parry = true; });
$('#bDash').addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') input.dash = true; });
$('#bBig').addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') input.big = true; });
$('#bLook').addEventListener('pointerdown', e => { e.preventDefault(); touchLook = true; });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) $('#bLook').addEventListener(ev, () => { touchLook = false; });

const muteBtn = $('#muteBtn');
function toggleMute() { muted = !muted; muteBtn.textContent = muted ? '音 切' : '音 入'; if (musBus) musBus.gain.value = muted ? 0 : .32; }
muteBtn.addEventListener('click', () => { ensureAudio(); toggleMute(); muteBtn.blur(); });
$('#pauseBtn').addEventListener('click', e => { if (state === 'play') pause(); else if (state === 'pause') resume(); e.currentTarget.blur(); });

// ---- loop ----
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try {
    if (state === 'play') {
      let rem = dt; while (rem > 1e-6 && state === 'play') { const s = Math.min(rem, 1 / 120); update(s); rem -= s; }
      if (now - lastCheckpoint > 1000) { lastCheckpoint = now; saveResume(); }
    }
    else if (B) B.spin += dt * .8;
    render();
  } catch (err) { console.error(err); }
}
// an idle enemy turns behind the menus
newGame({ mode: 'stage', st: STAGES[0], life: 0 }); RUN = null;
fit();
// A reload in the middle of a run (a republished version, or the browser dropping a background tab)
// goes straight back to that run, paused, instead of the title screen.
{
  const rd = loadResume();
  if (rd && Date.now() - rd.at < 30 * 60e3) { try { continueRun(rd); pause(); } catch (e) { clearResume(); titleScreen(); } }
  else titleScreen();
}
requestAnimationFrame(frame);
})();
</script>
